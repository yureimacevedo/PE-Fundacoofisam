const eliminarEntidadCompleta=async(entidadId)=>{
  const ref=db.collection('fundacoofisam_datos').doc(entidadId);
  const subcolecciones=['ejes','objetivos','indicadores','seguimientos','cargos','poa_actividades','planes_operativos','vrio','contraste','pestel','bmc','eric'];
  for(const col of subcolecciones){
    const snap=await ref.collection(col).get();
    let batch=db.batch();let count=0;
    for(const doc of snap.docs){
      batch.delete(doc.ref);count++;
      if(count%400===0){await batch.commit();batch=db.batch();}
    }
    if(count%400!==0)await batch.commit();
  }
  await ref.delete();
};

      }else{setUserRol(null);}
      setLoading(false);
    });
    return()=>unsub();
  },[]);
  if(loading)return <div className="loading">⏳ Cargando...</div>;
  if(!user)return <AuthScreen/>;
  return <MainApp user={user} userRol={userRol} userCargo={userCargo}/>;
};

  const[busquedaPOA,setBusquedaPOA]=useState('');const guardar=async(e)=>{e.preventDefault();setLoading(true);try{const scoreConfig={critico:{min:0,max:parseFloat(form.criticoMax||60),color:'#DC2626',label:'Crítico'},precaucion:{min:parseFloat(form.precaucionMin||61),max:parseFloat(form.precaucionMax||85),color:'#F59E0B',label:'Precaución'},optimo:{min:parseFloat(form.optimoMin||86),max:100,color:'#059669',label:'Óptimo'}};const data={nombre:form.nombre,periodo:form.periodo,scoreConfig};if(itemEdit){await db.collection('fundacoofisam_datos').doc(itemEdit.id).update(data);}else{await db.collection('fundacoofisam_datos').add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}setModal(null);setForm({});setItemEdit(null);}catch(error){alert('Error: '+error.message);}finally{setLoading(false);}};const eliminar=async(id)=>{if(!window.confirm('¿Eliminar entidad y TODOS sus datos (VRIO, PESTEL, Canvas, ERIC, Cargos, Ejes, Objetivos, Indicadores, etc.)? Esta acción no se puede deshacer.'))return;try{await eliminarEntidadCompleta(id);}catch(error){alert('Error: '+error.message);}};const editarEntidad=(ent)=>{setItemEdit(ent);setForm({nombre:ent.nombre,periodo:ent.periodo,criticoMax:ent.scoreConfig?.critico?.max||60,precaucionMin:ent.scoreConfig?.precaucion?.min||61,precaucionMax:ent.scoreConfig?.precaucion?.max||85,optimoMin:ent.scoreConfig?.optimo?.min||86});setModal('entidad');};

  };return(<div><div className="page-header"><h1>Mis Periodos PE</h1>{isAdmin&&<button className="btn-primary" style={{width:'auto'}} onClick={()=>{setItemEdit(null);setForm({nombre:'',periodo:'',criticoMax:'60',precaucionMin:'61',precaucionMax:'85',optimoMin:'86'});setModal('entidad');}}>+ Nuevo Periodo PE</button>}</div><div className="grid">{entidades.length===0?(<div className="empty-state"><h3>🏢 No hay periodos</h3><p>Crea tu primer periodo PE</p></div>):(entidades.map(ent=>(<div key={ent.id} className="card" style={{borderLeft:entidadActiva?.id===ent.id?'4px solid #00BEC8':'4px solid transparent'}}><h3>{ent.nombre}</h3><div className="badge" style={{background:'#00BEC8',color:'white',marginBottom:'0.5rem'}}>{ent.periodo}</div>{ent.scoreConfig&&(<p style={{color:'#059669',fontSize:'0.75rem',marginTop:'0.5rem'}}>Score: 0-{ent.scoreConfig.critico.max}% 🔴 | {ent.scoreConfig.precaucion.min}-{ent.scoreConfig.precaucion.max}% 🟡 | {ent.scoreConfig.optimo.min}%+ 🟢</p>)}{isAdmin&&<div className="btn-group"><button className="btn-edit" onClick={()=>editarEntidad(ent)}>✏️ Editar</button><button className="btn-secondary" onClick={()=>eliminar(ent.id)}>🗑️ Eliminar</button></div>}

t" className="btn-primary" disabled={loading}>{loading?'⏳ Guardando...':'💾 Guardar'}</button></form></div></div></div>)}</div>);};
const VistaDashboard=({entidad,datos})=>{
  const[anioSel,setAnioSel]=useState('');
  const[mesSel,setMesSel]=useState('');
  const[modalInforme,setModalInforme]=useState(false);
  const[actividadesPOA,setActividadesPOA]=useState([]);
  const[planesPOA,setPlanesPOA]=useState([]);

  useEffect(()=>{
    if(!entidad)return;
    const u1=db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setActividadesPOA(d);
    });
    const u2=db.collection('fundacoofisam_datos').doc(entidad.id).collection('planes_operativos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(b.anio||0)-(a.anio||0));
      setPlanesPOA(d);
    });
    return()=>{u1();u2();};
  },[entidad]);

  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const{ejes=[],objetivos=[],indicadores=[],seguimientos=[]}=datos;

  const mesesOrden=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre','Semestral 1','Semestral 2','Anual'];
  const aniosDisp=[...new Set(seguimientos.map(s=>String(s.anio)))].sort();
  const mesesDisp=[...new Set(seguimientos.filter(s=>!anioSel||String(s.anio)===anioSel).map(s=>s.mes))].sort((a,b)=>mesesOrden.indexOf(a)-mesesOrden.indexOf(b));
  const modoAnio=anioSel&&!mesSel; // "Ver todo el año" cuando hay año seleccionado pero no mes

  // Calcular período de referencia
  const periodos=[...new Set(seguimientos.map(s=>s.mes+'|'+s.anio))].sort((a,b)=>{
    const[mA,aA]=a.split('|');const[mB,aB]=b.split('|');
    if(aA!==aB)return parseInt(aA)-parseInt(aB);
    return mesesOrden.indexOf(mA)-mesesOrden.indexOf(mB);
  });
  const ultimoPeriodo=periodos[periodos.length-1];
  const[ultMes,ultAnio]=ultimoPeriodo?ultimoPeriodo.split('|'):['',''];

  const filtroMes=mesSel||(!modoAnio?ultMes:'');
  const filtroAnio=anioSel||ultAnio;
  const segsFiltrados=modoAnio
    ? seguimientos.filter(s=>String(s.anio)===String(filtroAnio))
    : seguimientos.filter(s=>String(s.anio)===String(filtroAnio)&&s.mes===filtroMes);
  const periodoLabel=modoAnio?`Todo el año ${filtroAnio}`:filtroMes&&filtroAnio?(filtroMes+' '+filtroAnio):'Sin datos';

  const porScore={critico:0,precaucion:0,optimo:0,sin_meta:0};
  if(modoAnio){
    indicadores.forEach(ind=>{
      const segsInd=segsFiltrados.filter(s=>s.indicadorId===ind.id);
      if(segsInd.length===0)return;
      const scores=['optimo','precaucion','critico','sin_meta'];
      const mejor=scores.find(sc=>segsInd.some(s=>s.score===sc))||'sin_meta';
      if(porScore[mejor]!==undefined)porScore[mejor]++;
    });
  }else{
    segsFiltrados.forEach(s=>{if(s.score&&porScore[s.score]!==undefined)porScore[s.score]++;});
  }

  const getMetaAnio=(ind,anio)=>{
    if(ind.metasPorAnio&&anio&&ind.metasPorAnio[String(anio)]!==undefined)
      return parseFloat(ind.metasPorAnio[String(anio)]);
    return parseFloat(ind.meta||0);
  };

      if(a.anio!==b.anio)return parseInt(b.anio)-parseInt(a.anio);
      return mesesOrden.indexOf(b.mes)-mesesOrden.indexOf(a.mes);
    })[0];

      });

    }else{

      if(ind.tipoMeta==='acumulativa'){
        avanceCalc=0;metaCalc=0;
        const todosSegs=seguimientos.filter(s=>s.indicadorId===ind.id&&String(s.anio)===String(filtroAnio));
        const indicesMes=mesesOrden.indexOf(filtroMes);
        todosSegs.forEach(s=>{

    return{...ind,ultimoSeguimiento:ultSeg,avanceAcum:avanceCalc,metaAcum:metaCalc,enPeriodo,objetivo:obj,eje:eje,segsAnio:segsAnioOrdenados};

  return(<div>

    {(()=>{
      const sc=entidad.scoreConfig||{critico:{min:0,max:60},precaucion:{min:61,max:85},optimo:{min:86,max:100}};
      const clasificar=(pct)=>{

      const pctIndRend=indsConRend.length>0?Math.round(indsConRend.reduce((acc,i)=>acc+Math.min(Math.max(parseFloat(i.ultimoSeguimiento?.rendimiento||0),0),100),0)/indsConRend.length):0;
      const clIndRend=totalInd>0?clasificar(pctIndRend):{label:'Sin datos',icon:'⚪',bg:'#F3F4F6',c:'#6B7280',borde:'#E5E7EB'};

      // ── Semáforo POA ──
      const anioActual=filtroAnio||new Date().getFullYear().toString();

      const actsDelPlan=planActivo?actividadesPOA.filter(a=>a.planId===planActivo.id):[];
      const pctPOA=calcAvancePOA(actsDelPlan);
      const clPOA=actsDelPlan.length>0?clasificar(pctPOA):{label:'Sin datos',icon:'⚪',bg:'#F3F4F6',c:'#6B7280',borde:'#E5E7EB'};
      const completadasPOA=actsDelPlan.filter(a=>a.estado==='Completado').length;
      const enProcesoPOA=actsDelPlan.filter(a=>a.estado==='En Proceso').length;
      const canceladasPOA=actsDelPlan.filter(a=>a.estado==='Cancelada').length;

      return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1.5rem'}}>

            {/* Por conteo */}
            <div style={{background:clIndConteo.bg,borderRadius:'8px',padding:'0.75rem',border:`1px solid ${clIndConteo.borde}`}}>

      <div className="stat-card" style={{borderLeftColor:'#DC2626'}}><div className="stat-label">🔴 Críticos</div><div className="stat-value">{indicadoresConEstado.filter(i=>i.ultimoSeguimiento?.score==='critico').length}</div></div>

        <tbody>{indicadoresConEstado.map(ind=>{
          const s=ind.ultimoSeguimiento;
          const sc={optimo:{bg:'#D1FAE5',c:'#065F46',icon:'🟢'},precaucion:{bg:'#FEF3C7',c:'#92400E',icon:'🟡'},critico:{bg:'#FEE2E2',c:'#991B1B',icon:'🔴'},sin_meta:{bg:'#F3F4F6',c:'#6B7280',icon:'⚪'}}[s?.score||'sin_meta']||{bg:'#F3F4F6',c:'#6B7280',icon:'—'};
          if(modoAnio&&ind.segsAnio&&ind.segsAnio.length>1){
            // Modo año: expandir una fila por mes
            return(<React.Fragment key={ind.id}>
              <tr style={{background:'#F0F4FF'}}>
                <td rowSpan={ind.segsAnio.length+1}><div className="badge" style={{background:ind.eje?.color||'#6B7280',color:'white',padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem'}}>{ind.eje?.nombre||'-'}</div></td>
                <td rowSpan={ind.segsAnio.length+1} style={{fontSize:'0.8rem',color:'#6B7280'}}>{ind.objetivo?.nombre}</td>
                <td colSpan={5}><strong>{ind.nombre}</strong> <span style={{fontSize:'0.75rem',color:'#6B7280'}}>({ind.segsAnio.length} registros en {filtroAnio})</span></td>
              </tr>
              {ind.segsAnio.map(seg=>{
                const scc={optimo:{bg:'#D1FAE5',c:'#065F46',icon:'🟢'},precaucion:{bg:'#FEF3C7',c:'#92400E',icon:'🟡'},critico:{bg:'#FEE2E2',c:'#991B1B',icon:'🔴'},sin_meta:{bg:'#F3F4F6',c:'#6B7280',icon:'⚪'}}[seg.score||'sin_meta']||{bg:'#F3F4F6',c:'#6B7280',icon:'—'};
                return(<tr key={seg.id}>
                  <td style={{fontSize:'0.8rem',color:'#00BEC8',fontWeight:600}}>{seg.mes}</td>
                  <td style={{fontSize:'0.8rem'}}>{(seg.metaMes||getMetaAnio(ind,seg.anio)||0)+' '+(ind.unidad||'')}</td>
                  <td style={{fontSize:'0.8rem'}}><strong>{parseFloat(seg.avance||0).toFixed(2)}</strong> {ind.unidad||''}</td>
                  <td style={{fontSize:'0.8rem'}}><strong>{(seg.rendimiento||0).toFixed(1)}%</strong></td>
                  <td><span style={{padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem',fontWeight:700,background:scc.bg,color:scc.c}}>{scc.icon} {seg.score==='optimo'?'Óptimo':seg.score==='precaucion'?'Precaución':seg.score==='critico'?'Crítico':'Sin meta'}</span></td>
                </tr>);
              })}
            </React.Fragment>);
          }
          return(<tr key={ind.id} style={{opacity:ind.enPeriodo||!s?1:0.7}}>
            <td><div className="badge" style={{background:ind.eje?.color||'#6B7280',color:'white',padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem'}}>{ind.eje?.nombre||'-'}</div></td>
            <td style={{fontSize:'0.8rem',color:'#6B7280',maxWidth:'120px'}}>{ind.objetivo?.nombre}</td>
            <td><strong>{ind.nombre}</strong>{!ind.enPeriodo&&s&&<span style={{fontSize:'0.7rem',color:'#9CA3AF',marginLeft:'0.3rem'}}>(último: {s.mes} {s.anio})</span>}</td>
            <td>{s?(ind.metaAcum||getMetaAnio(ind,filtroAnio)||s.metaAnual)+' '+(ind.unidad||''):'-'}</td>
            <td>{s?<div><div><strong>{ind.avanceAcum.toFixed(2)}</strong> {ind.unidad||''}</div>{ind.tipoMeta==='acumulativa'&&<div style={{fontSize:'0.7rem',color:'#6B7280'}}>📈 Acumulado</div>}</div>:'-'}</td>
            <td>{s?<strong>{((ind.avanceAcum||0)/(ind.metaAcum||1)*100).toFixed(1)}%</strong>:'-'}</td>
            <td>{s?<span style={{padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.8rem',fontWeight:700,background:sc.bg,color:sc.c}}>{sc.icon} {s.score==='optimo'?'Óptimo':s.score==='precaucion'?'Precaución':s.score==='critico'?'Crítico':'Sin meta'}</span>:'-'}</td>
          </tr>);
        })}</tbody>
      </table>
    </div>}

    {modalInforme&&<ModalImpresionDashboard entidad={entidad} datos={datos} periodo={periodoLabel} onClose={()=>setModalInforme(false)}/>}
  </div>);
};
const CargosSelect=({value,onChange,entidad})=>{

const VistaCargos=({entidad})=>{
  const[cargos,setCargos]=useState([]);
  const[modal,setModal]=useState(false);
  useEffect(()=>{
    const migrar=async()=>{
      try{
        const snap=await db.collection('fundacoofisam_cargos').get();
        if(!snap.empty)return;
        const periodos=await db.collection('fundacoofisam_datos').get();
        const vistos=new Set();
        for(const periodo of periodos.docs){
          const cs=await periodo.ref.collection('cargos').get();
          for(const doc of cs.docs){
            const d=doc.data();
            if(d.nombre&&!vistos.has(d.nombre)){
              vistos.add(d.nombre);
              const {createdAt,...rest}=d;
              await db.collection('fundacoofisam_cargos').add({...rest,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
            }
          }
        }
        if(vistos.size>0)console.log('Cargos migrados:',vistos.size);
      }catch(e){console.warn('Migracion cargos:',e);}
    };
    migrar();
  },[]);
  const[form,setForm]=useState({nombre:'',descripcion:'',area:''});
  const[itemEdit,setItemEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  useEffect(()=>{
    const unsub=db.collection('fundacoofisam_cargos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>a.nombre.localeCompare(b.nombre));setCargos(d);
    });
    return()=>unsub();
  },[entidad?.id]);
  const areasExistentes=[...new Set(cargos.map(c=>c.area).filter(Boolean))].sort();
  const guardar=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('fundacoofisam_cargos');
      if(itemEdit){await ref.doc(itemEdit.id).update({nombre:form.nombre,descripcion:form.descripcion||'',area:form.area||''});}
      else{await ref.add({nombre:form.nombre,descripcion:form.descripcion||'',area:form.area||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
      setModal(false);setForm({nombre:'',descripcion:'',area:''});setItemEdit(null);setMsg('Guardado.');
      setTimeout(()=>setMsg(''),3000);
    }catch(err){setMsg('Error: '+err.message);}
    finally{setLoading(false);}
  };
  const eliminar=async(id)=>{if(!window.confirm('¿Eliminar cargo?'))return;await db.collection('fundacoofisam_cargos').doc(id).delete();};
  const editar=(c)=>{setItemEdit(c);setForm({nombre:c.nombre,descripcion:c.descripcion||'',area:c.area||''});setModal(true);};
  return(<div>
    <div className="page-header"><h1>🏷️ Cargos</h1>
      <button className="btn-primary" style={{width:'auto'}} onClick={()=>{setItemEdit(null);setForm({nombre:'',descripcion:'',area:''});setModal(true);}}>+ Nuevo Cargo</button>
    </div>
    {msg&&<div style={{padding:'0.75rem',borderRadius:'8px',background:'#D1FAE5',color:'#065F46',marginBottom:'1rem'}}>{msg}</div>}
    <div className="card">
      <p style={{color:'#6B7280',marginBottom:'1rem'}}>Los cargos son compartidos por todos los periodos PE — es la misma gente. El campo Área agrupa varios cargos (ej. "Líder de Riesgos" y "Analista de Riesgos" → área "Riesgos") para que compartan la misma información en Análisis y Diagnóstico.</p>
      {cargos.length===0?<p style={{color:'#6B7280'}}>No hay cargos creados aún.</p>:
      <div className="grid">{cargos.map(c=><div key={c.id} className="card" style={{borderLeft:'4px solid #00BEC8',margin:0}}>
        <h4>{c.nombre}</h4>
        {c.area?<span style={{fontSize:'0.75rem',color:'#00BEC8',fontWeight:600}}>🗂️ Área: {c.area}</span>:<span style={{fontSize:'0.75rem',color:'#DC2626'}}>⚠️ Sin área asignada</span>}
        {c.descripcion&&<p style={{color:'#6B7280',fontSize:'0.875rem',marginTop:'0.25rem'}}>{c.descripcion}</p>}
        <div className="btn-group">
          <button className="btn-edit" onClick={()=>editar(c)}>✏️ Editar</button>
          <button className="btn-secondary" onClick={()=>eliminar(c.id)}>🗑️ Eliminar</button>
        </div>
      </div>)}</div>}
    </div>
    {modal&&<div className="modal-overlay" onClick={()=>{setModal(false);setItemEdit(null);}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h2>{itemEdit?'Editar':'Nuevo'} Cargo</h2>
          <button className="btn-cerrar" onClick={()=>{setModal(false);setItemEdit(null);}}>x</button>
        </div>
        <div className="modal-body"><form onSubmit={guardar}>
          <div className="form-group"><label>Nombre *</label>
            <input type="text" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} required placeholder="Ej. Líder de Riesgos"/>
          </div>
          <div className="form-group"><label>Área *</label>
            <input type="text" list="areas-existentes" value={form.area} onChange={e=>setForm({...form,area:e.target.value})} required placeholder="Ej. Riesgos"/>
            <datalist id="areas-existentes">{areasExistentes.map(a=><option key={a} value={a}/>)}</datalist>
            <small style={{color:'#6B7280',display:'block',marginTop:'0.25rem'}}>Varios cargos pueden compartir la misma área (ej. Coordinador y Auxiliar de Talento Humano → "Talento Humano").</small>
          </div>
          <div className="form-group"><label>Descripción</label>
            <textarea value={form.descripcion} onChange={e=>setForm({...form,descripcion:e.target.value})} rows={2}/>
          </div>
          <button type="submit" className="btn-primary" disabled={loading}>{loading?'Guardando...':'💾 Guardar'}</button>
        </form></div>
      </div>
    </div>}
  </div>);
};

const VistaDireccionamiento=({entidad,isAdmin})=>{
  const[mision,setMision]=useState('');
  const[vision,setVision]=useState('');
  const[valores,setValores]=useState([]);
  const[nuevoValor,setNuevoValor]=useState('');
  const[nuevoDesc,setNuevoDesc]=useState('');
  const[principios,setPrincipios]=useState([]);
  const[nuevoPrincipio,setNuevoPrincipio]=useState('');
  const[nuevoPrincipioDesc,setNuevoPrincipioDesc]=useState('');
  const[loading,setLoading]=useState(false);
  useEffect(()=>{
    if(!entidad)return;
    setMision(entidad.mision||'');
    setVision(entidad.vision||'');
    setValores(entidad.valores||[]);
    setPrincipios(entidad.principios||[]);
  },[entidad]);
  if(!entidad)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const guardar=async(campo,valor)=>{
    setLoading(true);
    try{await db.collection('fundacoofisam_datos').doc(entidad.id).update({[campo]:valor});}
    catch(error){alert('Error: '+error.message);}
    finally{setLoading(false);}
  };
  const agregarValor=async(e)=>{
    e.preventDefault();
    if(!nuevoValor.trim())return;
    const next=[...valores,{nombre:nuevoValor,descripcion:nuevoDesc}];
    setValores(next);
    await guardar('valores',next);
    setNuevoValor('');setNuevoDesc('');
  };
  const quitarValor=async(idx)=>{
    const next=valores.filter((_,i)=>i!==idx);
    setValores(next);
    await guardar('valores',next);
  };
  const agregarPrincipio=async(e)=>{
    e.preventDefault();
    if(!nuevoPrincipio.trim())return;
    const next=[...principios,{nombre:nuevoPrincipio,descripcion:nuevoPrincipioDesc}];
    setPrincipios(next);
    await guardar('principios',next);
    setNuevoPrincipio('');setNuevoPrincipioDesc('');
  };
  const quitarPrincipio=async(idx)=>{
    const next=principios.filter((_,i)=>i!==idx);
    setPrincipios(next);
    await guardar('principios',next);
  };
  return(<div>
    <div className="page-header"><h1>Direccionamiento Estratégico</h1></div>
    <div className="card">
      <h3>Misión</h3>
      {isAdmin
        ?<textarea rows={3} value={mision} onChange={e=>setMision(e.target.value)} onBlur={()=>guardar('mision',mision)} placeholder="¿Para qué existe la entidad?" style={{width:'100%',padding:'0.75rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'1rem'}}/>
        :<p style={{color:'#374151'}}>{mision||'Sin definir.'}</p>}
    </div>
    <div className="card">
      <h3>Visión</h3>
      {isAdmin
        ?<textarea rows={3} value={vision} onChange={e=>setVision(e.target.value)} onBlur={()=>guardar('vision',vision)} placeholder="¿Qué quiere ser la entidad en el horizonte del plan?" style={{width:'100%',padding:'0.75rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'1rem'}}/>
        :<p style={{color:'#374151'}}>{vision||'Sin definir.'}</p>}
    </div>
    <div className="card">
      <h3>Valores</h3>
      {valores.length===0&&<p style={{color:'#6B7280'}}>Sin valores definidos aún.</p>}
      {valores.map((v,idx)=>(
        <div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem',padding:'0.6rem 0',borderTop:idx>0?'1px solid #E5E7EB':'none'}}>
          <div><strong>{v.nombre}</strong>{v.descripcion&&<span style={{color:'#6B7280'}}> — {v.descripcion}</span>}</div>
          {isAdmin&&<button className="btn-secondary" onClick={()=>quitarValor(idx)}>🗑️</button>}
        </div>
      ))}
      {isAdmin&&<form onSubmit={agregarValor} style={{display:'flex',gap:'0.5rem',marginTop:'1rem',flexWrap:'wrap'}}>
        <input style={{flex:'1 1 180px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoValor} onChange={e=>setNuevoValor(e.target.value)} placeholder="Valor (ej. Transparencia)"/>
        <input style={{flex:'2 1 260px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoDesc} onChange={e=>setNuevoDesc(e.target.value)} placeholder="Descripción breve (opcional)"/>
        <button type="submit" className="btn-primary" style={{width:'auto'}} disabled={loading}>+ Agregar</button>
      </form>}
    </div>
    <div className="card">
      <h3>Principios</h3>
      {principios.length===0&&<p style={{color:'#6B7280'}}>Sin principios definidos aún.</p>}
      {principios.map((p,idx)=>(
        <div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem',padding:'0.6rem 0',borderTop:idx>0?'1px solid #E5E7EB':'none'}}>
          <div><strong>{p.nombre}</strong>{p.descripcion&&<span style={{color:'#6B7280'}}> — {p.descripcion}</span>}</div>
          {isAdmin&&<button className="btn-secondary" onClick={()=>quitarPrincipio(idx)}>🗑️</button>}
        </div>
      ))}
      {isAdmin&&<form onSubmit={agregarPrincipio} style={{display:'flex',gap:'0.5rem',marginTop:'1rem',flexWrap:'wrap'}}>
        <input style={{flex:'1 1 180px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoPrincipio} onChange={e=>setNuevoPrincipio(e.target.value)} placeholder="Principio (ej. Buena fe)"/>
        <input style={{flex:'2 1 260px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoPrincipioDesc} onChange={e=>setNuevoPrincipioDesc(e.target.value)} placeholder="Descripción breve (opcional)"/>
        <button type="submit" className="btn-primary" style={{width:'auto'}} disabled={loading}>+ Agregar</button>
      </form>}
    </div>
  </div>);
};

  const guardarIndicador=async(e)=>{
    e.preventDefault();

        form.anios.split(',').forEach(a=>{

          if(anio)metasPorAnio[anio]=parseFloat(form[`meta_${anio}`]||form.meta);

// Función para formatear y mostrar tareas
const formatearTareas=(texto,limite=null)=>{
  if(!texto)return null;
  const lineas=texto.split('\n').filter(l=>l.trim());
  const tareas=lineas.map(l=>l.trim().replace(/^[-•*]\s*/,''));
  
  if(limite&&tareas.length>limite){
    const mostrar=tareas.slice(0,limite);
    const resto=tareas.length-limite;
    return(<div>
      {mostrar.map((t,i)=><div key={i} style={{fontSize:'0.85rem',color:'#6B7280',marginBottom:'0.15rem'}}>• {t}</div>)}
      <div style={{fontSize:'0.75rem',color:'#9CA3AF',marginTop:'0.25rem'}}>... (+{resto} más)</div>
    </div>);
  }
  
  return(<div>
    {tareas.map((t,i)=><div key={i} style={{fontSize:'0.85rem',color:'#6B7280',marginBottom:'0.25rem'}}>• {t}</div>)}
  </div>);
};

const formatearTareasCheckbox=(texto)=>{

};

// ── Funciones globales de cálculo POA ──
const getMesesRango=(inicio,fin)=>{
  if(!inicio||!fin)return[];
  const meses=[];
  const nombresMes=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let [ay,am]=inicio.split('-').map(Number);
  const [fy,fm]=fin.split('-').map(Number);
  while(ay<fy||(ay===fy&&am<=fm)){
    meses.push({key:`${ay}-${String(am).padStart(2,'0')}`,label:`${nombresMes[am-1]} ${ay}`,anio:ay,mes:am});
    am++;if(am>12){am=1;ay++;}
  }
  return meses;
};
const calcAvanceActividad=(act)=>{
  if(act.estado==='Completada'||act.estado==='Completado')return 100;
  if(act.estado==='Cancelada'||act.estado==='Programada')return 0;
  const meses=getMesesRango(act.fechaInicio,act.fechaFin);
  if(meses.length===0)return 0;
  const porMes=100/meses.length;
  const registrados=(act.seguimientoMensual||{});
  const mesesConRegistro=meses.filter(m=>registrados[m.key]&&registrados[m.key].observacion).length;
  return Math.round(mesesConRegistro*porMes);
};
const calcAvancePOA=(acts)=>{
  if(acts.length===0)return 0;
  const suma=acts.reduce((acc,a)=>acc+calcAvanceActividad(a),0);
  return Math.round(suma/acts.length);
};

const vrioTier=(v,r,i,o)=>{
  if(v&&r&&i&&o)return{label:'Ventaja sostenida',color:'#059669',bg:'#D1FAE5',accion:null};
  if(v&&r&&i&&!o)return{label:'Ventaja sin explotar',color:'#00BEC8',bg:'#D0F4F6',accion:'incrementar'};
  if(v&&r&&!i)return{label:'Ventaja temporal',color:'#B45309',bg:'#FEF3C7',accion:'incrementar'};
  if(v&&!r)return{label:'Paridad competitiva',color:'#6B7280',bg:'#F3F4F6',accion:'reducir'};
  return{label:'Desventaja competitiva',color:'#991B1B',bg:'#FEE2E2',accion:'eliminar'};
};
const agruparSintesis=(eric)=>{
  const candidatas=eric.filter(e=>e.accion==='incrementar'||e.accion==='crear');
  const grupos={};const sueltas=[];
  candidatas.forEach(e=>{
    if(e.lineaPropuesta&&e.lineaPropuesta.trim()){(grupos[e.lineaPropuesta]=grupos[e.lineaPropuesta]||[]).push(e);}
    else sueltas.push(e);
  });
  return{grupos,sueltas};
};
const contrasteDecision=(relevante,capacidad,cumplimiento)=>{
  const c=Number(cumplimiento)||0;
  if(relevante==='no')return{label:'Reemplazar',color:'#991B1B',bg:'#FEE2E2'};
  if(relevante==='si'&&capacidad==='si'&&c>=70)return{label:'Mantener',color:'#059669',bg:'#D1FAE5'};
  return{label:'Ajustar',color:'#B45309',bg:'#FEF3C7'};
};
const BMC_BLOCKS=[
  {key:'socios',label:'Socios clave',area:'socios'},{key:'actividades',label:'Actividades clave',area:'actividades'},
  {key:'recursos',label:'Recursos clave',area:'recursos'},{key:'valor',label:'Propuesta de valor',area:'valor'},
  {key:'relaciones',label:'Relación con clientes',area:'relaciones'},{key:'canales',label:'Canales',area:'canales'},
  {key:'segmentos',label:'Segmentos de clientes',area:'segmentos'},{key:'costos',label:'Estructura de costos',area:'costos'},
  {key:'ingresos',label:'Fuentes de ingreso',area:'ingresos'},
];
const BMC_LABEL=Object.fromEntries(BMC_BLOCKS.map(b=>[b.key,b.label]));
const ERIC_QUADS=[
  {key:'eliminar',label:'Eliminar',emoji:'🗑️',color:'#991B1B',bg:'#FEE2E2',hint:'¿Qué ya no aporta valor?'},
  {key:'reducir',label:'Reducir',emoji:'✂️',color:'#B45309',bg:'#FEF3C7',hint:'¿Qué se hace en exceso?'},
  {key:'incrementar',label:'Incrementar',emoji:'📈',color:'#00BEC8',bg:'#D0F4F6',hint:'¿Qué merece más atención?'},
  {key:'crear',label:'Crear',emoji:'✨',color:'#059669',bg:'#D1FAE5',hint:'¿Qué no existe hoy?'},
];
const ERIC_LABEL=Object.fromEntries(ERIC_QUADS.map(q=>[q.key,q]));
const PESTEL_DIMS=[{key:'politico',label:'Político'},{key:'economico',label:'Económico'},{key:'social',label:'Social'},{key:'tecnologico',label:'Tecnológico'},{key:'ecologico',label:'Ecológico'},{key:'legal',label:'Legal'}];

const Chip=({color,bg,children})=>(<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'0.2rem 0.65rem',borderRadius:999,fontSize:'0.75rem',fontWeight:700,color,background:bg,whiteSpace:'nowrap'}}>{children}</span>);

const descargarBlob=(blob,filename)=>{
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const exportarWordAnalisis=async(entidad,vrio,contraste,pestel,bmc,eric,areaLabel)=>{
  const{Document,Packer,Paragraph,TextRun,HeadingLevel,Table,TableRow,TableCell,WidthType,ShadingType}=window.docx;
  const H1=(t)=>new Paragraph({heading:HeadingLevel.HEADING_1,spacing:{before:300,after:150},children:[new TextRun({text:t,bold:true,color:'4C1D95'})]});
  const P=(t)=>new Paragraph({spacing:{after:120},children:[new TextRun({text:t})]});
  const cell=(t,header)=>new TableCell({width:{size:2500,type:WidthType.DXA},shading:header?{type:ShadingType.CLEAR,fill:'4F46E5'}:undefined,margins:{top:80,bottom:80,left:100,right:100},children:[new Paragraph({children:[new TextRun({text:String(t==null?'':t),bold:!!header,color:header?'FFFFFF':'000000'})]})]});
  const tabla=(headers,rows)=>new Table({width:{size:10000,type:WidthType.DXA},rows:[new TableRow({children:headers.map(h=>cell(h,true))}),...rows.map(r=>new TableRow({children:r.map(v=>cell(v))}))]});

  const vrioRows=vrio.map(v=>{const t=vrioTier(v.valioso,v.raro,v.inimitable,v.organizado);return[v.area,v.recurso,t.label];});
  const contrasteRows=contraste.map(c=>{const d=contrasteDecision(c.relevante,c.capacidad,c.cumplimiento);return[c.area,c.linea,d.label];});
  const pestelRows=pestel.map(p=>[p.area,PESTEL_DIMS.find(d=>d.key===p.dimension)?.label||'',p.factor,p.tipo==='oportunidad'?'Oportunidad':'Amenaza']);
  const bmcRows=bmc.map(b=>[b.area,BMC_LABEL[b.bloque],b.texto]);
  const ericRows=eric.map(e=>[e.area,ERIC_LABEL[e.accion]?.label||'',e.texto,e.lineaPropuesta||'']);
  const{grupos:sintesisGrupos,sueltas:sintesisSueltas}=agruparSintesis(eric);
  const sintesisChildren=[];
  Object.entries(sintesisGrupos).forEach(([nombre,items])=>{
    sintesisChildren.push(new Paragraph({spacing:{before:160,after:60},children:[new TextRun({text:'🎯 '+nombre,bold:true,color:'4F46E5'})]}));
    items.forEach(it=>sintesisChildren.push(P('• ['+(ERIC_LABEL[it.accion]?.label||'')+'] '+it.texto+' ('+it.area+')')));
  });
  if(sintesisSueltas.length>0){
    sintesisChildren.push(new Paragraph({spacing:{before:160,after:60},children:[new TextRun({text:'Ideas sin agrupar',bold:true,color:'6B7280'})]}));
    sintesisSueltas.forEach(it=>sintesisChildren.push(P('• ['+(ERIC_LABEL[it.accion]?.label||'')+'] '+it.texto+(it.lineaPropuesta?' — '+it.lineaPropuesta:'')+' ('+it.area+')')));
  }
  if(sintesisChildren.length===0)sintesisChildren.push(P('Sin líneas candidatas todavía.'));

  const doc_=new Document({sections:[{children:[
    new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'Análisis y Diagnóstico — '+entidad.nombre,bold:true,color:'4C1D95'})]}),
    P('Ámbito: '+(areaLabel||'Todas las áreas')),
    H1('VRIO'),vrio.length?tabla(['Área','Recurso','Clasificación'],vrioRows):P('Sin registros.'),
    H1('Matriz de contraste'),contraste.length?tabla(['Área','Línea vigente','Decisión'],contrasteRows):P('Sin registros.'),
    H1('PESTEL'),pestel.length?tabla(['Área','Dimensión','Factor','Tipo'],pestelRows):P('Sin registros.'),
    H1('Business Model Canvas'),bmc.length?tabla(['Área','Bloque','Nota'],bmcRows):P('Sin registros.'),
    H1('ERIC al Canvas'),eric.length?tabla(['Área','Acción','Idea','Línea propuesta'],ericRows):P('Sin registros.'),
    H1('Síntesis — líneas estratégicas candidatas'),...sintesisChildren,
  ]}]});
  const blob=await Packer.toBlob(doc_);
  descargarBlob(blob,'AnalisisDiagnostico_'+entidad.nombre.replace(/\s+/g,'_')+'.docx');
};

const exportarExcelAnalisis=(entidad,vrio,contraste,pestel,bmc,eric)=>{
  const wb=XLSX.utils.book_new();
  const vrioRows=vrio.map(v=>({Área:v.area,Cargo:v.cargo||'',Recurso:v.recurso,Descripción:v.descripcion,Valioso:v.valioso?'Sí':'No',Raro:v.raro?'Sí':'No',Inimitable:v.inimitable?'Sí':'No',Organizado:v.organizado?'Sí':'No',Clasificación:vrioTier(v.valioso,v.raro,v.inimitable,v.organizado).label}));
  const contrasteRows=contraste.map(c=>({Área:c.area,Cargo:c.cargo||'','Línea vigente':c.linea,'Relevante externamente':c.relevante,'Capacidad interna':c.capacidad,'% Cumplimiento':c.cumplimiento,Decisión:contrasteDecision(c.relevante,c.capacidad,c.cumplimiento).label}));
  const pestelRows=pestel.map(p=>({Área:p.area,Cargo:p.cargo||'',Dimensión:PESTEL_DIMS.find(d=>d.key===p.dimension)?.label,Factor:p.factor,Impacto:p.impacto,Probabilidad:p.probabilidad,Tipo:p.tipo==='oportunidad'?'Oportunidad':'Amenaza'}));
  const bmcRows=bmc.map(b=>({Área:b.area,Cargo:b.cargo||'',Bloque:BMC_LABEL[b.bloque],Nota:b.texto,'Enlazado a':b.origenLabel||''}));
  const ericRows=eric.map(e=>({Área:e.area,Cargo:e.cargo||'',Acción:ERIC_LABEL[e.accion]?.label,Idea:e.texto,'Enlazado a':e.refLabel||'','Línea propuesta':e.lineaPropuesta||''}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(vrioRows),'VRIO');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(contrasteRows),'Matriz de contraste');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pestelRows),'PESTEL');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bmcRows),'Business Model Canvas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ericRows),'ERIC y líneas');
  const{grupos:sintesisGruposXls,sueltas:sintesisSueltasXls}=agruparSintesis(eric);
  const sintesisRows=[];
  Object.entries(sintesisGruposXls).forEach(([nombre,items])=>{
    items.forEach(it=>sintesisRows.push({'Línea estratégica':nombre,Área:it.area,Acción:ERIC_LABEL[it.accion]?.label,Idea:it.texto}));
  });
  sintesisSueltasXls.forEach(it=>sintesisRows.push({'Línea estratégica':it.lineaPropuesta||'(sin agrupar)',Área:it.area,Acción:ERIC_LABEL[it.accion]?.label,Idea:it.texto}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sintesisRows),'Síntesis');
  XLSX.writeFile(wb,'AnalisisDiagnostico_'+entidad.nombre.replace(/\s+/g,'_')+'.xlsx');
};

const TRANSVERSAL='Transversal / Corporativo';

const VistaAnalisis=({entidad,isAdmin,isMonitoreo,userCargo,user})=>{
  const[sub,setSub]=useState('vrio');
  const[cargos,setCargos]=useState([]);
  const[areaActiva,setAreaActiva]=useState('');
  const[modalPrint,setModalPrint]=useState(false);
  const[exportando,setExportando]=useState(false);
  const[cargandoEjemplo,setCargandoEjemplo]=useState(false);
  const canEdit=isAdmin||!isMonitoreo;
  const canEditEntry=(entry)=>isAdmin||(entry?.autorUid&&entry.autorUid===user?.uid);
  useEffect(()=>{
    const unsub=db.collection('fundacoofisam_cargos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setCargos(d);
    });
    return()=>unsub();
  },[]);
  const areasExistentes=[...new Set([...cargos.map(c=>c.area).filter(Boolean),TRANSVERSAL])].sort();
  const miCargo=cargos.find(c=>c.nombre===userCargo);
  const miArea=miCargo?miCargo.area:'';
  const areaFiltro=isAdmin?(areaActiva||null):(miArea||null);

  const[vrio,setVrio]=useState([]);
  const[contraste,setContraste]=useState([]);
  const[pestel,setPestel]=useState([]);
  const[bmc,setBmc]=useState([]);
  const[eric,setEric]=useState([]);
  useEffect(()=>{
    if(!entidad)return;
    const ref=db.collection('fundacoofisam_datos').doc(entidad.id);
    const creadoMs=(d)=>{
      if(!d.creado)return Date.now();
      if(typeof d.creado.toMillis==='function')return d.creado.toMillis();
      if(d.creado.seconds)return d.creado.seconds*1000;
      return 0;
    };
    const ordenar=(arr)=>[...arr].sort((a,b)=>creadoMs(b)-creadoMs(a));
    const withArea=(coll,setter)=>{
      // Nota: sin orderBy() en la consulta a propósito, para no requerir un índice
      // compuesto en Firestore. El orden se aplica aquí mismo, en el navegador.
      if(!areaFiltro){
        return ref.collection(coll).onSnapshot(s=>{setter(ordenar(s.docs.map(d=>({id:d.id,...d.data()}))));});
      }
      let dataA=[],dataB=[];
      const merge=()=>{const map={};[...dataA,...dataB].forEach(d=>map[d.id]=d);setter(ordenar(Object.values(map)));};
      const u1=ref.collection(coll).where('area','==',areaFiltro).onSnapshot(s=>{dataA=s.docs.map(d=>({id:d.id,...d.data()}));merge();});
      const u2=ref.collection(coll).where('area','==',TRANSVERSAL).onSnapshot(s=>{dataB=s.docs.map(d=>({id:d.id,...d.data()}));merge();});
      return()=>{u1();u2();};
    };
    const u1=withArea('vrio',setVrio),u2=withArea('contraste',setContraste),u3=withArea('pestel',setPestel),u4=withArea('bmc',setBmc),u5=withArea('eric',setEric);
    return()=>{u1();u2();u3();u4();u5();};
  },[entidad,areaFiltro]);

  if(!entidad)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  if(!isAdmin&&!userCargo)return <div className="empty-state"><h3>🏷️ Sin cargo asignado</h3><p>Tu usuario todavía no tiene un cargo asignado en esta entidad. Pide al administrador que te lo asigne desde "Usuarios" para poder ver y registrar la información de tu área.</p></div>;
  if(!isAdmin&&userCargo&&!miArea)return <div className="empty-state"><h3>🗂️ Tu cargo no tiene área asignada</h3><p>Tu cargo (<strong>{userCargo}</strong>) existe, pero todavía no está asociado a un área. Pide al administrador que complete el campo "Área" para ese cargo desde el menú "Cargos".</p></div>;

  const ref=db.collection('fundacoofisam_datos').doc(entidad.id);

  const remove=(coll,id)=>{if(window.confirm('¿Eliminar?'))ref.collection(coll).doc(id).delete();};
  const update=(coll,id,data)=>ref.collection(coll).doc(id).update(data);

    {key:'vrio',label:'🧬 VRIO'},{key:'contraste',label:'📋 Matriz de contraste'},{key:'pestel',label:'🌬️ PESTEL'},

  ];

  };

        {typeof MODO_PRUEBA!=='undefined'&&MODO_PRUEBA&&isAdmin&&<button className="btn-secondary" onClick={onDatosEjemplo} disabled={cargandoEjemplo} style={{border:'2px solid #059669',color:'#059669'}}>🌱 {cargandoEjemplo?'Cargando...':'Datos de ejemplo'}</button>}
        <button className="btn-primary" style={{width:'auto'}} onClick={()=>setModalPrint(true)}>🖨️ Imprimir</button>
        <button className="btn-primary" style={{width:'auto'}} onClick={onWord} disabled={exportando}>📄 {exportando?'Generando...':'Word'}</button>
        <button className="btn-primary" style={{width:'auto'}} onClick={onExcel}>📊 Excel</button>
      </div>

          {t.label}
        </button>

      <span style={{fontSize:'0.8rem',color:'#6B7280'}}>Tu cargo: </span><Chip color="#6B7280" bg="#F3F4F6">{userCargo}</Chip>
      <span style={{fontSize:'0.8rem',color:'#6B7280',marginLeft:8}}>→ Área: </span><Chip color="#00BEC8" bg="#D0F4F6">🗂️ {miArea}</Chip>
      <span style={{fontSize:'0.75rem',color:'#9CA3AF',marginLeft:10}}>(también ves lo marcado como {TRANSVERSAL})</span>
      {!canEdit&&<span style={{marginLeft:8,fontSize:'0.8rem',color:'#6B7280'}}>(modo monitoreo — solo lectura)</span>}
    </div>}

const AnalisisEric=({entries,bmc,vrio,area,cargo,isAdmin,canEdit,userId,onAdd,onUpdate,onRemove})=>(
  <div>
    <p style={{color:'#6B7280',marginBottom:'1rem'}}>Puedes registrar ideas aquí, o marcarlas directamente desde un recurso VRIO.</p>
    <div className="grid">
      {ERIC_QUADS.map(q=><EricQuad key={q.key} quad={q} entries={entries.filter(e=>e.accion===q.key)} area={area} cargo={cargo} isAdmin={isAdmin} canEdit={canEdit} userId={userId} bmc={bmc} vrio={vrio} onAdd={onAdd} onUpdate={onUpdate} onRemove={onRemove}/>)}
    </div>
  </div>
);
const EricQuad=({quad,entries,area,cargo,isAdmin,canEdit,userId,bmc,vrio,onAdd,onUpdate,onRemove})=>{
  const[editId,setEditId]=useState(null);
  const[editArea,setEditArea]=useState('');
  const[text,setText]=useState('');const[refValue,setRefValue]=useState('');const[transversal,setTransversal]=useState(false);
  const limpiar=()=>{setEditId(null);setEditArea('');setText('');setRefValue('');setTransversal(false);};
  const editar=(item)=>{setEditId(item.id);setEditArea(item.area||'');setText(item.texto);setRefValue(item.refTipo?item.refTipo+':'+item.refId:'');setTransversal(item.area===TRANSVERSAL);};
  const submit=(e)=>{e.preventDefault();if(!text.trim())return;
    const areaFinal=transversal?TRANSVERSAL:(area||editArea||'Sin asignar');
    let data={area:areaFinal,cargo:cargo||'',accion:quad.key,texto:text,refTipo:null,refId:null,refLabel:null,refBloque:null};
    if(refValue){const[tipo,id]=refValue.split(':');
      if(tipo==='bmc'){const n=bmc.find(x=>x.id===id);if(n){data.refTipo='bmc';data.refId=id;data.refBloque=n.bloque;data.refLabel=n.texto;}}
      if(tipo==='vrio'){const v=vrio.find(x=>x.id===id);if(v){data.refTipo='vrio';data.refId=id;data.refLabel=v.recurso;}}}
    if(editId)onUpdate(editId,data);else onAdd(data);
    limpiar();};
  return(<div className="card">
    <h4 style={{color:quad.color}}>{quad.emoji} {quad.label}</h4>
    <p style={{color:'#6B7280',fontSize:'0.8rem'}}>{quad.hint}</p>
    <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:170,overflowY:'auto',margin:'0.5rem 0'}}>
      {entries.length===0&&<span style={{fontSize:'0.75rem',color:'#9CA3AF'}}>Sin ideas registradas.</span>}
      {entries.map(e=>(<div key={e.id} style={{background:quad.bg,borderRadius:8,padding:'0.5rem 0.7rem',fontSize:'0.8rem',display:'flex',justifyContent:'space-between',gap:8}}>
        <div><div>{e.texto}</div><div style={{opacity:0.7,fontSize:'0.7rem'}}>🗂️ {e.area}{e.refLabel&&<span> · 🔗 {e.refTipo==='bmc'?BMC_LABEL[e.refBloque]+': ':'VRIO: '}{e.refLabel}</span>}{e.lineaPropuesta&&<span> · 🎯 {e.lineaPropuesta}</span>}{e.autorNombre&&<span> · ✍️ {e.autorNombre}</span>}</div></div>
        {(isAdmin||(e?.autorUid&&e.autorUid===userId))&&<div style={{display:'flex',flexDirection:'column',gap:2}}><button onClick={()=>editar(e)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.6}}>✏️</button><button onClick={()=>onRemove(e.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.5}}>🗑️</button></div>}
      </div>))}
    </div>
    {canEdit&&<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:6}}>
      {editId&&<div style={{fontSize:'0.7rem',color:'#00BEC8',fontWeight:600}}>✏️ Editando — <a href="#" onClick={ev=>{ev.preventDefault();limpiar();}} style={{color:'#6B7280',fontWeight:400}}>cancelar</a></div>}
      <select value={refValue} onChange={e=>setRefValue(e.target.value)} style={{fontSize:'0.7rem',padding:'0.3rem',border:'1px solid #E5E7EB',borderRadius:6}}>
        <option value="">Enlazar a (opcional)...</option>
        {bmc.length>0&&<optgroup label="Notas del Canvas">{bmc.map(n=><option key={n.id} value={'bmc:'+n.id}>{BMC_LABEL[n.bloque]}: {n.texto}</option>)}</optgroup>}
        {vrio.length>0&&<optgroup label="Recursos VRIO">{vrio.map(v=><option key={v.id} value={'vrio:'+v.id}>{v.recurso}</option>)}</optgroup>}
      </select>
      <div style={{display:'flex',gap:6}}>
        <input value={text} onChange={e=>setText(e.target.value)} placeholder={'Idea para '+quad.label.toLowerCase()+'...'} disabled={!editId&&!area&&!transversal} style={{flex:1,fontSize:'0.8rem',padding:'0.4rem 0.6rem',border:'1px solid #E5E7EB',borderRadius:6}}/>
        <button type="submit" disabled={!editId&&!area&&!transversal} style={{borderRadius:6,padding:'0 0.8rem',background:'#00BEC8',color:'white',border:'none',cursor:'pointer'}}>{editId?'💾':'+'}</button>
      </div>
      {!area&&!transversal&&<span style={{fontSize:'0.7rem',color:'#DC2626'}}>Selecciona un área arriba primero.</span>}
      {isAdmin&&<TransversalCheck checked={transversal} onChange={setTransversal}/>}
    </form>}
  </div>);
};

const AnalisisSintesis=({eric,bmc,onUpdate})=>{
  const candidatas=eric.filter(e=>e.accion==='incrementar'||e.accion==='crear');
  const[seleccion,setSeleccion]=useState([]);
  const[nombreGrupo,setNombreGrupo]=useState('');

  const grupos={};const sueltas=[];
  candidatas.forEach(e=>{
    if(e.lineaPropuesta&&e.lineaPropuesta.trim()){
      (grupos[e.lineaPropuesta]=grupos[e.lineaPropuesta]||[]).push(e);
    }else sueltas.push(e);
  });

  const toggleSel=(id)=>setSeleccion(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const agrupar=async(e)=>{
    e.preventDefault();
    if(!nombreGrupo.trim()||seleccion.length===0)return;
    for(const id of seleccion)await onUpdate(id,{lineaPropuesta:nombreGrupo});
    setSeleccion([]);setNombreGrupo('');
  };
  const desagrupar=async(id)=>{await onUpdate(id,{lineaPropuesta:''});};
  const renombrarGrupo=async(nombreViejo,nombreNuevo)=>{
    if(!nombreNuevo.trim()||nombreNuevo===nombreViejo)return;
    for(const it of grupos[nombreViejo])await onUpdate(it.id,{lineaPropuesta:nombreNuevo});
  };

  const Tarjeta=({e})=>{
    const quad=ERIC_LABEL[e.accion];
    const notaBmc=e.refTipo==='bmc'?bmc.find(n=>n.id===e.refId):null;
    return(
      <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'0.5rem 0',borderTop:'1px solid #F3F4F6'}}>
        <input type="checkbox" checked={seleccion.includes(e.id)} onChange={()=>toggleSel(e.id)} style={{marginTop:4}}/>
        <div style={{flex:1}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:4}}>
            {e.refTipo==='vrio'&&<Chip color="#B45309" bg="#FEF3C7">VRIO: {e.refLabel}</Chip>}
            {notaBmc&&<Chip color="#00BEC8" bg="#D0F4F6">{BMC_LABEL[notaBmc.bloque]}: {notaBmc.texto}</Chip>}
            <Chip color={quad.color} bg={quad.bg}>{quad.label}: {e.texto}</Chip>
            <Chip color="#6B7280" bg="#F3F4F6">🗂️ {e.area}</Chip>
          </div>
          {e.lineaPropuesta&&<button onClick={()=>desagrupar(e.id)} style={{fontSize:'0.7rem',color:'#DC2626',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Quitar del grupo</button>}
        </div>
      </div>
    );
  };

  return(<div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
    <p style={{color:'#6B7280'}}>Marca varias ideas de Incrementar/Crear y agrúpalas en una sola línea estratégica cuando en realidad son la misma idea. Las que dejes sueltas quedan como candidatas independientes.</p>

    {seleccion.length>0&&<form onSubmit={agrupar} className="card" style={{background:'#D0F4F6',display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'flex-end'}}>
      <div className="form-group" style={{flex:'1 1 260px',marginBottom:0}}>
        <label>Nombre de línea estratégica para las {seleccion.length} ideas seleccionadas</label>
        <input value={nombreGrupo} onChange={e=>setNombreGrupo(e.target.value)} placeholder="Ej. Fortalecimiento del canal digital de servicio"/>
      </div>
      <button type="submit" className="btn-primary" style={{width:'auto'}}>Agrupar seleccionadas</button>
      <button type="button" className="btn-secondary" style={{width:'auto'}} onClick={()=>setSeleccion([])}>Cancelar selección</button>
    </form>}

    {Object.keys(grupos).length===0&&sueltas.length===0&&<p style={{color:'#6B7280'}}>Aún no hay ideas de tipo Incrementar o Crear.</p>}

    {Object.entries(grupos).map(([nombre,items])=>(
      <div key={nombre} className="card" style={{borderLeft:'4px solid #00BEC8'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{fontSize:'1.5rem'}}>🎯</span>
          <input defaultValue={nombre} onBlur={ev=>renombrarGrupo(nombre,ev.target.value)} style={{fontWeight:700,fontSize:'1rem',border:'none',borderBottom:'2px solid transparent',padding:'0.2rem 0'}} onFocus={ev=>ev.target.style.borderBottom='2px solid #00BEC8'}/>
          <span style={{fontSize:'0.75rem',color:'#6B7280'}}>({items.length} ideas agrupadas)</span>
        </div>
        {items.map(e=><Tarjeta key={e.id} e={e}/>)}
      </div>
    ))}

    {sueltas.length>0&&<div className="card">
      <h3 style={{fontSize:'1rem',marginBottom:4}}>Ideas sin agrupar</h3>
      {sueltas.map(e=>(
        <div key={e.id}>
          <Tarjeta e={e}/>
          <div style={{paddingLeft:26,paddingBottom:10}}>
            <input defaultValue={e.lineaPropuesta||''} onBlur={ev=>onUpdate(e.id,{lineaPropuesta:ev.target.value})} placeholder="Nombrar como línea independiente..." style={{width:'100%',maxWidth:420,padding:'0.4rem 0.6rem',border:'1px solid #E5E7EB',borderRadius:6,fontSize:'0.85rem'}}/>
          </div>
        </div>
      ))}
    </div>}
  </div>);
};
// ===================== FIN ANÁLISIS Y DIAGNÓSTICO =====================

const VistaPlanOperativo=({user,entidad,datos,isAdmin,isMonitoreo,userCargo})=>{
  const[vista,setVista]=useState('planes');
  const[planSel,setPlanSel]=useState(null);
  const[planes,setPlanes]=useState([]);
  const[actividades,setActividades]=useState([]);
  const[modalPlan,setModalPlan]=useState(false);
  const[modalActividad,setModalActividad]=useState(false);
  const[modalSeguimiento,setModalSeguimiento]=useState(null);
  const[modalScore,setModalScore]=useState(false);
  const[todasActividades,setTodasActividades]=useState([]);
  const[formPlan,setFormPlan]=useState({});
  const[formActividad,setFormActividad]=useState({});
  const[itemEdit,setItemEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');
  const planesFiltrados=planes.filter(p=>{
    if(!p.nombre.toLowerCase().includes(busquedaPOA.toLowerCase()))return false;
    if(!isMonitoreo&&!isAdmin&&userCargo&&p.lider&&p.lider.trim().toLowerCase()!==userCargo.trim().toLowerCase())return false;
    return true;
  });
  
  
  
  useEffect(()=>{
    if(!entidad)return;
    const unsub=db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setTodasActividades(d);
    });
    return()=>unsub();
  },[entidad]);
  useEffect(()=>{
    if(!entidad)return;
    const unsub=db.collection('fundacoofisam_datos').doc(entidad.id).collection('planes_operativos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(b.anio||0)-(a.anio||0));
      setPlanes(d);
    });
    return()=>unsub();
  },[entidad]);
  
  useEffect(()=>{
    if(!entidad||!planSel)return;
    const unsub=db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').where('planId','==',planSel.id).onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(a.fechaInicio||'').localeCompare(b.fechaInicio||''));
      setActividades(d);
    });
    return()=>unsub();
  },[entidad,planSel]);
  
  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const{ejes=[],objetivos=[]}=datos;
  
  const guardarPlan=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('fundacoofisam_datos').doc(entidad.id).collection('planes_operativos');
      const data={...formPlan,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      if(itemEdit){
        await ref.doc(itemEdit.id).update(data);
      }else{
        await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
      setModalPlan(false);setFormPlan({});setItemEdit(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const eliminarPlan=async(id)=>{
    if(!window.confirm('¿Eliminar plan y todas sus actividades?'))return;
    const batch=db.batch();
    batch.delete(db.collection('fundacoofisam_datos').doc(entidad.id).collection('planes_operativos').doc(id));
    const acts=await db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').where('planId','==',id).get();
    acts.forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
  };
  
  const guardarActividad=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades');
      const data={
        ...formActividad,
        planId:planSel.id,
        estado:formActividad.estado||'Programada',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      if(itemEdit){
        await ref.doc(itemEdit.id).update(data);
      }else{
        await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
      setModalActividad(false);setFormActividad({});setItemEdit(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const eliminarActividad=async(id)=>{
    if(!window.confirm('¿Eliminar?'))return;
    await db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').doc(id).delete();
  };
  
  const guardarSeguimiento=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const updateData={
        estado:modalSeguimiento.estado,
        observacionesSeguimiento:modalSeguimiento.observacionesSeguimiento,
        fechaCambioEstado:new Date().toISOString().split('T')[0]
      };
      if(modalSeguimiento.estado==='Reprogramado'){
        if(!modalSeguimiento.fechaReprogramada){alert('Debes ingresar la nueva fecha reprogramada.');setLoading(false);return;}
        updateData.fechaReprogramada=modalSeguimiento.fechaReprogramada;
        updateData.historialReprogramaciones=firebase.firestore.FieldValue.arrayUnion({
          fecha:new Date().toISOString().split('T')[0],
          nuevaFecha:modalSeguimiento.fechaReprogramada,
          motivo:modalSeguimiento.observacionesSeguimiento||''
        });
      }
      if(modalSeguimiento.estado==='Cancelada'){
        if(!modalSeguimiento.observacionesSeguimiento){alert('Debes ingresar el motivo de cancelación.');setLoading(false);return;}
      }
      await db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').doc(modalSeguimiento.id).update(updateData);
      setModalSeguimiento(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const estadoColor={
    'Programada':{bg:'#FEF3C7',c:'#92400E'},
    'En Proceso':{bg:'#D0F4F6',c:'#1E40AF'},
    'Completado':{bg:'#D1FAE5',c:'#065F46'},
    'Reprogramado':{bg:'#FEE2E2',c:'#991B1B'},
    'Cancelada':{bg:'#F3F4F6',c:'#374151'}
  };

  const guardarSeguimientoMensual=async(act,mesKey,observacion)=>{
    if(!observacion.trim())return;
    try{
      const update={};
      update[`seguimientoMensual.${mesKey}.observacion`]=observacion;
      update[`seguimientoMensual.${mesKey}.fecha`]=new Date().toISOString().split('T')[0];
      if(act.estado==='Programada'){update.estado='En Proceso';update.fechaCambioEstado=new Date().toISOString().split('T')[0];}
      await db.collection('fundacoofisam_datos').doc(entidad.id).collection('poa_actividades').doc(act.id).update(update);
    }catch(err){alert('Error: '+err.message);}
  };

  // Funciones de cálculo disponibles globalmente (getMesesRango, calcAvanceActividad, calcAvancePOA)
  
  return(<div>
    <div className="page-header">
      <h1>🗓️ Plan Operativo Anual</h1>
      {!planSel?
        (!isMonitoreo&&<button className="btn-primary" style={{width:'auto'}} onClick={()=>{setFormPlan({anio:new Date().getFullYear().toString()});setItemEdit(null);setModalPlan(true);}} disabled={!isAdmin}>+ Nuevo POA</button>)
      :
        <div style={{display:'flex',gap:'0.5rem'}}>
          <button className={`btn-${vista==='actividades'?'primary':'secondary'}`} onClick={()=>setVista('actividades')} style={{width:'auto'}}>📋 Actividades</button>
          <button className={`btn-${vista==='seguimiento'?'primary':'secondary'}`} onClick={()=>setVista('seguimiento')} style={{width:'auto'}}>✅ Seguimiento</button>
          <button className="btn-primary" onClick={()=>setModalScore(true)} style={{width:'auto',background:'#059669'}}>📊 Avance</button>
          <button className="btn-secondary" onClick={()=>{setPlanSel(null);setVista('planes');}} style={{width:'auto'}}>← Volver</button>
        </div>
      }
    </div>
    
    {!planSel?
    <div>
      <div className="card">
        <div style={{marginBottom:'1rem'}}>
          <input 
            type="text" 
            placeholder="🔍 Buscar plan por nombre..." 
            value={busquedaPOA} 
            onChange={e=>setBusquedaPOA(e.target.value)}
            style={{width:'100%',padding:'0.75rem',border:'1px solid #D1D5DB',borderRadius:'8px',fontSize:'0.95rem'}}
          />
        </div>
        <h3>Planes Operativos ({planesFiltrados.length})</h3>
        {planesFiltrados.length===0?<p style={{color:'#9CA3AF'}}>No hay planes. Crea el primero.</p>:
        <div style={{display:'grid',gap:'1rem'}}>
          {planesFiltrados.map(plan=>{
            const actsPlan=todasActividades.filter(a=>a.planId===plan.id);
            const avance=calcAvancePOA(actsPlan);
            const objs=objetivos.filter(o=>(plan.objetivosIds||[]).includes(o.id));
            return(<div key={plan.id} className="card" style={{padding:'1rem',background:'#F9FAFB',cursor:'pointer'}} onClick={()=>{setPlanSel(plan);setVista('actividades');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1}}>
                  <h4 style={{margin:'0 0 0.5rem 0',color:'#111827'}}>{plan.nombre}</h4>
                  <p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#6B7280'}}>📅 Año: {plan.anio}</p>
                  <p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#6B7280'}}>🎯 Objetivos: {objs.length}</p>
                  {plan.lider&&<p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#00BEC8'}}>👤 Líder: {plan.lider}</p>}
                  <div style={{marginTop:'0.5rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                      <span style={{fontSize:'0.8rem',color:'#6B7280'}}>Avance:</span>
                      <span style={{fontSize:'0.85rem',fontWeight:700,color:avance>=100?'#059669':avance>=50?'#F59E0B':'#DC2626'}}>{avance}%</span>
                    </div>
                    <div style={{width:'100%',height:'6px',background:'#E5E7EB',borderRadius:'3px'}}>
                      <div style={{width:avance+'%',height:'100%',background:avance>=100?'#059669':avance>=50?'#F59E0B':'#DC2626'}}></div>
                    </div>
                  </div>
                  {objs.length>0&&<div style={{marginTop:'0.5rem',display:'flex',flexWrap:'wrap',gap:'0.25rem'}}>
                    {objs.map(obj=><span key={obj.id} style={{fontSize:'0.75rem',padding:'0.25rem 0.5rem',background:'#E0F8FA',color:'#00BEC8',borderRadius:'4px'}}>{obj.nombre}</span>)}
                  </div>}
                  {plan.descripcion&&<p style={{margin:'0.5rem 0 0 0',fontSize:'0.85rem',color:'#6B7280',fontStyle:'italic'}}>"{plan.descripcion}"</p>}
                </div>
                <div style={{display:'flex',gap:'0.3rem'}} onClick={e=>e.stopPropagation()}>
                  {!isMonitoreo&&<button className="btn-edit" onClick={()=>{setFormPlan(plan);setItemEdit(plan);setModalPlan(true);}} style={{padding:'0.3rem 0.5rem',fontSize:'0.75rem'}}>✏️</button>}
                  {!isMonitoreo&&<button className="btn-secondary" onClick={()=>eliminarPlan(plan.id)} style={{padding:'0.3rem 0.5rem',fontSize:'0.75rem'}}>🗑️</button>}
                </div>
              </div>
            </div>);
          })}
        </div>}
      </div>
    </div>
    :
    <div>
      <div className="card" style={{marginBottom:'1rem',background:'#E0F8FA'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <h3 style={{margin:'0 0 0.25rem 0',color:'#00BEC8'}}>{planSel.nombre}</h3>
            <p style={{margin:0,fontSize:'0.85rem',color:'#6B7280'}}>📅 {planSel.anio} • 🎯 {(planSel.objetivosIds||[]).length} objetivos • 📝 {actividades.length} actividades</p>
          </div>
        </div>
      </div>
      
      {vista==='actividades'?
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
          <h3>Actividades ({actividades.length})</h3>
